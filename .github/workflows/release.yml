name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: dist/eConverter.app/Contents/MacOS/econverter
            artifact: eConverter-macos-arm64
          - os: ubuntu-latest
            binary: dist/econverter/econverter
            artifact: eConverter-linux-x86_64
          - os: windows-latest
            binary: dist/econverter/econverter.exe
            artifact: eConverter-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run pyinstaller --noconfirm --clean econverter.spec

      # PyInstaller silently drops the engine's data files; only a real
      # conversion through the frozen binary catches it.
      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          printf '# Title\n\nBody text.\n' > book.md
          "${{ matrix.binary }}" book.md epub
          test -s book.epub
          "${{ matrix.binary }}" book.epub mobi
          test -s book.mobi
          "${{ matrix.binary }}" book.epub kfx
          test -s book.kfx
          "${{ matrix.binary }}" book.kfx mobi
          test -s book.mobi
          "${{ matrix.binary }}" book.epub azw3 boko
          test -s book.azw3
          "${{ matrix.binary }}" book.azw3 md boko
          test -s book.md
          "${{ matrix.binary }}" book.azw3 kfx boko
          test -s book.kfx
          "${{ matrix.binary }}" book.kfx epub boko
          test -s book.epub
          # libpdfium is bundled by a pyinstaller-hooks-contrib hook, only a frozen run proves it
          uv run --with reportlab python -c "
          from reportlab.pdfgen import canvas
          c = canvas.Canvas('from-pdf.pdf'); c.drawString(72, 720, 'Extractable text'); c.save()
          "
          "${{ matrix.binary }}" from-pdf.pdf epub
          test -s from-pdf.epub

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/eConverter.app ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist econverter
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/econverter -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Unsigned builds. macOS: right-click → Open, or
            `xattr -dr com.apple.quarantine eConverter.app`.

            PDF input needs no external tools: text, embedded images, bookmarks,
            title and a first-page cover are read with PDFium.
