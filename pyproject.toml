[project]
name = "econverter-desktop"
version = "0.1.2"
description = "Desktop ebook converter - epub, mobi, azw3, docx and more."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
# <3.15: the engine builds an re.Scanner with capturing groups, rejected since 3.15.
requires-python = ">=3.11,<3.15"
dependencies = ["ebook-converter-lib>=1.4.0", "boko-python==0.1.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

# System Pythons frequently ship a broken or missing _tkinter; managed builds bundle Tk.
[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["econverter_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
